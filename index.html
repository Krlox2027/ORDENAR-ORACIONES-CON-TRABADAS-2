<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordena Oraciones con el profesor Carlos Huancaya Matos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Comic Neue y Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef08a 50%, #fed7aa 100%);
            min-height: 100vh;
            touch-action: manipulation;
        }
        .title-font {
            font-family: 'Comic Neue', cursive;
        }
        .word-chip {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        .word-chip:active {
            cursor: grabbing;
        }
        .word-chip:hover {
            transform: translateY(-4px) scale(1.04);
        }
        .drop-zone {
            min-height: 110px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .drop-zone.drag-over {
            background-color: #e0f2fe;
            border-color: #2563eb;
        }
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-gentle {
            animation: bounce-gentle 1.8s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-6 min-h-screen">

    <!-- Encabezado Principal -->
    <header class="w-full max-w-4xl text-center bg-white/95 backdrop-blur-md border-4 border-amber-300 shadow-xl rounded-3xl p-4 md:p-6 mb-4">
        <h1 class="title-font text-3xl md:text-5xl text-indigo-700 drop-shadow-sm tracking-wide">
            ⭐ ¡Aprendo a Ordenar Oraciones! ⭐
        </h1>
        <h2 class="text-lg md:text-2xl font-bold text-amber-600 mt-2">
            con el profesor Carlos Huancaya Matos 👨‍🏫✨
        </h2>
        
        <div class="flex justify-center items-center gap-4 mt-4 flex-wrap">
            <span class="bg-indigo-100 text-indigo-900 font-extrabold px-5 py-2 rounded-full text-base md:text-lg border-2 border-indigo-300 shadow-inner">
                Ejercicio <span id="current-ex">1</span> de 30
            </span>
            <span class="bg-emerald-100 text-emerald-900 font-extrabold px-5 py-2 rounded-full text-base md:text-lg border-2 border-emerald-300 shadow-inner">
                🏆 Aciertos: <span id="score">0</span> / 30
            </span>
        </div>
    </header>

    <!-- Contenedor Principal Interactivos (Sin Imagen) -->
    <main class="w-full max-w-4xl bg-white/95 backdrop-blur-md border-4 border-indigo-300 shadow-2xl rounded-3xl p-6 md:p-10 flex flex-col gap-6">
        
        <!-- Etiqueta de la Trabada actual -->
        <div class="flex justify-between items-center bg-indigo-50 border-2 border-indigo-200 px-4 py-2 rounded-2xl">
            <span class="text-base md:text-xl font-bold text-indigo-800">
                <i class="fa-solid fa-puzzle-piece text-amber-500 mr-2"></i> Ordena la oración:
            </span>
            <span id="trabada-tag" class="bg-purple-200 text-purple-900 font-extrabold text-sm md:text-base px-4 py-1 rounded-full uppercase tracking-wider">
                Trabada
            </span>
        </div>

        <!-- Zona donde el niño construye la oración -->
        <div class="flex flex-col gap-2">
            <label class="text-base md:text-lg font-bold text-slate-700">
                👇 Arrastra o toca las palabras para armar la oración aquí:
            </label>
            <div id="drop-zone" class="drop-zone bg-amber-50/90 border-4 dashed border-amber-400 rounded-3xl p-4 flex flex-wrap gap-3 items-center justify-center shadow-inner min-h-[120px]">
                <!-- Se ubican las palabras seleccionadas -->
            </div>
        </div>

        <!-- Banco de Palabras Desordenadas -->
        <div class="bg-indigo-50/90 border-4 border-indigo-200 rounded-3xl p-5 flex flex-col gap-3">
            <span class="text-sm md:text-base font-extrabold text-indigo-900 uppercase tracking-wide">
                🧩 Palabras desordenadas:
            </span>
            <div id="word-bank" class="flex flex-wrap gap-3 items-center justify-center min-h-[80px]">
                <!-- Se inyectan las fichas de palabras -->
            </div>
        </div>

        <!-- Botones de Acción (Voz, Comprobar, Reiniciar) -->
        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between pt-2">
            <button onclick="speakCorrectSentence()" class="w-full sm:w-auto bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-lg border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition text-lg flex items-center justify-center gap-3">
                <i class="fa-solid fa-volume-high text-2xl"></i>
                <span>Escuchar oración</span>
            </button>

            <div class="flex gap-3 w-full sm:w-auto">
                <button onclick="resetCurrentExercise()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-5 py-3.5 rounded-2xl transition text-base md:text-lg flex items-center justify-center">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Reiniciar
                </button>
                <button onclick="checkAnswer()" class="flex-1 sm:flex-none bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-black px-8 py-3.5 rounded-2xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition text-xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Comprobar</span>
                </button>
            </div>
        </div>

        <!-- Mensaje de Feedback -->
        <div id="feedback-msg" class="text-center font-extrabold text-xl min-h-[36px] rounded-2xl py-2 transition-all"></div>

    </main>

    <!-- Navegación inferior de ejercicios -->
    <footer class="w-full max-w-4xl mt-4 bg-white/90 backdrop-blur-md border-2 border-indigo-200 shadow-lg rounded-2xl p-3 flex items-center justify-between gap-2">
        <button onclick="prevExercise()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-extrabold px-4 py-2 rounded-xl text-base border border-indigo-300">
            ⬅️ Anterior
        </button>
        <div id="exercise-dots" class="flex gap-1.5 overflow-x-auto py-1 max-w-[60vw]">
            <!-- Puntos generados dinámicamente -->
        </div>
        <button onclick="nextExercise()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-extrabold px-4 py-2 rounded-xl text-base border border-indigo-300">
            Siguiente ➡️
        </button>
    </footer>

    <script>
        // 30 Oraciones de mayor nivel (6 a 8 palabras), 
        // integrando sílabas trabadas y con punto final (.) obligatorio en la última palabra.
        const masterExercises = [
            { text: "El profesor Carlos enseña con mucho cariño.", tag: "pro" },
            { text: "Mi linda blusa blanca tiene un botón.", tag: "bla / blu" },
            { text: "El plato plano está muy bien limpio.", tag: "pla / bla" },
            { text: "Clara clava tres clavos en la madera.", tag: "cla" },
            { text: "Prudencia prueba una rica fruta de estación.", tag: "pru / fru" },
            { text: "Pablo sopla burbujas de jabón en el parque.", tag: "blo / bla" },
            { text: "El plomero repara la tubería de la casa.", tag: "plo" },
            { text: "Carlos compra flores hermosas para su querida mamá.", tag: "pro" },
            { text: "El clavel rojo huele muy rico hoy.", tag: "cla" },
            { text: "Blanca dibuja una bonita paloma en el papel.", tag: "bla" },
            { text: "Plácido planta flores de colores en el jardín.", tag: "pla" },
            { text: "El teclado negro del colegio suena muy fuerte.", tag: "cla" },
            { text: "Mi primo practica su deporte favorito con alegría.", tag: "pri / pra" },
            { text: "El libro nuevo contiene cuentos muy divertidos.", tag: "blo" },
            { text: "Carlos compra plátanos dulces en el mercado grande.", tag: "pla / gra" },
            { text: "La blusa azul de mi hermana luce hermosa.", tag: "blu" },
            { text: "El club deportivo entrena feliz por las mañanas.", tag: "clu" },
            { text: "La buena profesora explica la lección muy atenta.", tag: "pro" },
            { text: "Teresa prepara una deliciosa crema para el postre.", tag: "pre" },
            { text: "El caballero usa su brillante espada de metal.", tag: "bla" },
            { text: "El clima frío congela el agua de la tina.", tag: "cli" },
            { text: "Bruno compra pan caliente para toda su familia.", tag: "bru" },
            { text: "La plaza limpia tiene muchos árboles muy verdes.", tag: "pla" },
            { text: "El barco blanco navega rápidamente en el mar.", tag: "bla" },
            { text: "Claudia dibuja un planeta gigante en la pizarra.", tag: "cla / pla" },
            { text: "El valiente tigre camina por la selva verde.", tag: "tra / gra" },
            { text: "Brenda prefiere comer fruta fresca en el desayuno.", tag: "bre / pre / fru" },
            { text: "El carpintero clava muchas tablas de madera dura.", tag: "cla" },
            { text: "Mi prima cumple seis años en este mes.", tag: "pri / ple" },
            { text: "El cielo azul tiene nubes blancas muy suaves.", tag: "bla" }
        ];

        let exercises = [];
        let currentIndex = 0;
        let score = 0;
        let completedExercises = new Array(30).fill(false);
        let currentWords = [];
        let placedWords = [];

        // Función para mezclar aleatoriamente las oraciones
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initApp() {
            // Mezclar ejercicios para que sea distinto en cada computadora/sesión
            exercises = shuffleArray(masterExercises);
            score = 0;
            completedExercises.fill(false);
            updateScoreUI();
            setupDragAndDrop();
            loadExercise(0);
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
        }

        function renderDots() {
            const dotsContainer = document.getElementById('exercise-dots');
            dotsContainer.innerHTML = '';
            exercises.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-8 h-8 rounded-full font-bold text-xs transition-all flex items-center justify-center shrink-0 ${
                    idx === currentIndex 
                        ? 'bg-indigo-600 text-white scale-110 shadow-md ring-2 ring-indigo-300' 
                        : completedExercises[idx]
                        ? 'bg-emerald-500 text-white'
                        : 'bg-indigo-100 text-indigo-800 hover:bg-indigo-200'
                }`;
                dot.innerText = idx + 1;
                dot.onclick = () => loadExercise(idx);
                dotsContainer.appendChild(dot);
            });
        }

        function loadExercise(index) {
            currentIndex = index;
            document.getElementById('current-ex').innerText = currentIndex + 1;
            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('feedback-msg').className = 'text-center font-extrabold text-xl min-h-[36px] rounded-2xl py-2 transition-all';
            
            const ex = exercises[currentIndex];
            document.getElementById('trabada-tag').innerText = `Trabada: ${ex.tag.toUpperCase()}`;

            // Separar palabras
            const rawWords = ex.text.split(' ');
            
            // Asegurar que queden desordenadas
            let shuffled = shuffleArray(rawWords);
            if (shuffled.join(' ') === ex.text && shuffled.length > 1) {
                shuffled.reverse();
            }

            currentWords = [...shuffled];
            placedWords = [];

            renderWords();
            renderDots();
        }

        function renderWords() {
            const bankContainer = document.getElementById('word-bank');
            const dropContainer = document.getElementById('drop-zone');

            bankContainer.innerHTML = '';
            dropContainer.innerHTML = '';

            // Renderizar banco de palabras
            if (currentWords.length === 0) {
                bankContainer.innerHTML = '<span class="text-indigo-400 font-bold text-base italic select-none">¡Todas las palabras fueron colocadas arriba! ✨</span>';
            } else {
                currentWords.forEach((word, idx) => {
                    const chip = createWordChip(word, idx, 'bank');
                    bankContainer.appendChild(chip);
                });
            }

            // Renderizar zona de ordenamiento
            if (placedWords.length === 0) {
                dropContainer.innerHTML = '<span class="text-amber-400 font-bold text-base md:text-xl italic select-none">Toca o arrastra aquí las palabras...</span>';
            } else {
                placedWords.forEach((word, idx) => {
                    const chip = createWordChip(word, idx, 'drop');
                    dropContainer.appendChild(chip);
                });
            }
        }

        function createWordChip(word, index, location) {
            const btn = document.createElement('div');
            btn.className = "word-chip bg-white border-3 border-indigo-500 text-indigo-950 font-black px-4 py-2.5 rounded-2xl shadow-md text-lg md:text-2xl hover:bg-indigo-50 transition active:scale-95 flex items-center justify-center";
            btn.innerText = word;
            btn.draggable = true;

            // Soporte Clic / Toque Táctil
            btn.onclick = () => {
                playAudioPop();
                if (location === 'bank') {
                    currentWords.splice(index, 1);
                    placedWords.push(word);
                } else {
                    placedWords.splice(index, 1);
                    currentWords.push(word);
                }
                renderWords();
            };

            // Soporte Drag & Drop
            btn.ondragstart = (e) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ word, location, index }));
                btn.classList.add('opacity-40');
            };

            btn.ondragend = () => {
                btn.classList.remove('opacity-40');
            };

            return btn;
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');

            dropZone.ondragover = (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            };

            dropZone.ondragleave = () => {
                dropZone.classList.remove('drag-over');
            };

            dropZone.ondrop = (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                const dataRaw = e.dataTransfer.getData('text/plain');
                if (!dataRaw) return;

                const data = JSON.parse(dataRaw);
                playAudioPop();

                if (data.location === 'bank') {
                    currentWords.splice(data.index, 1);
                    placedWords.push(data.word);
                    renderWords();
                }
            };
        }

        function resetCurrentExercise() {
            loadExercise(currentIndex);
        }

        function checkAnswer() {
            const userSentence = placedWords.join(' ');
            const targetSentence = exercises[currentIndex].text;
            const feedback = document.getElementById('feedback-msg');

            if (userSentence === targetSentence) {
                if (!completedExercises[currentIndex]) {
                    completedExercises[currentIndex] = true;
                    score++;
                    updateScoreUI();
                }

                feedback.innerText = '🎉 ¡EXCELENTE! La oración está correcta ⭐';
                feedback.className = 'text-center font-extrabold text-xl rounded-2xl py-2 bg-emerald-100 text-emerald-800 border-2 border-emerald-300 animate-bounce-gentle';
                
                playSuccessSound();
                speakCorrectSentence();
                renderDots();

                setTimeout(() => {
                    if (currentIndex < exercises.length - 1) {
                        nextExercise();
                    } else {
                        feedback.innerText = '🏆 ¡FELICIDADES! Has completado las 30 oraciones con el profesor Carlos. 🌟';
                        feedback.className = 'text-center font-extrabold text-2xl rounded-2xl py-3 bg-amber-100 text-amber-900 border-2 border-amber-400';
                    }
                }, 1600);

            } else {
                feedback.innerText = '❌ Inténtalo de nuevo. Revisa el orden de las palabras. 💪';
                feedback.className = 'text-center font-extrabold text-lg rounded-2xl py-2 bg-rose-100 text-rose-800 border-2 border-rose-300';
                playWrongSound();
            }
        }

        function nextExercise() {
            if (currentIndex < exercises.length - 1) {
                loadExercise(currentIndex + 1);
            }
        }

        function prevExercise() {
            if (currentIndex > 0) {
                loadExercise(currentIndex - 1);
            }
        }

        function speakCorrectSentence() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textToSpeak = exercises[currentIndex].text;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'es-ES';
                utterance.rate = 0.8; // Velocidad pausada para niños de 1° grado
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function playAudioPop() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.06);
            } catch(e) {}
        }

        function playSuccessSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        }

        function playWrongSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        window.onload = initApp;
    </script>
</body>
</html>
